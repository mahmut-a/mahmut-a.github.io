<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menü - Restoranlar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 data-translate="app-title">QR Menü</h1>
            <button id="language-toggle" class="lang-toggle" aria-label="Dil Değiştir">
                <span id="current-lang">TR</span>
            </button>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 data-translate="restaurants-title">Restoranlar</h2>
            <div id="restaurants-container" class="restaurants-grid">
                <!-- Restoranlar buraya yüklenecek -->
            </div>
            <div id="loading" class="loading" data-translate="loading">Yükleniyor...</div>
            <div id="error" class="error" style="display: none;"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/language.js"></script>
    <script src="js/restaurant-config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
