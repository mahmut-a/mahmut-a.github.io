<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="menu-title">Menü</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="container">
            <a style="color: white; text-decoration: none;" href="index.html"><h1 id="restaurant-name" data-translate="menu-title">Menü</h1></a>
            <button id="language-toggle" class="lang-toggle" aria-label="Dil Değiştir">
                <span id="current-lang">TR</span>
            </button>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="loading" class="loading" data-translate="loading">Yükleniyor...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="menu-container">
                <!-- Menü içeriği buraya yüklenecek -->
            </div>
        </div>
    </main>

    <!-- Sepet Floating Button -->
    <button id="cart-toggle" class="cart-toggle" aria-label="Sepet">
        <span class="cart-icon">🛒</span>
        <span id="cart-count" class="cart-count">0</span>
    </button>

    <!-- Sepet Sidebar -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-sidebar-header">
            <h2 data-translate="cart-title">Sepet</h2>
            <button id="cart-close" class="cart-close" aria-label="Sepeti Kapat">×</button>
        </div>
        <div id="cart-items" class="cart-items">
            <!-- Sepet öğeleri buraya yüklenecek -->
        </div>
        <div class="cart-sidebar-footer">
            <div class="cart-total">
                <span data-translate="total">Toplam:</span>
                <span id="cart-total-price" class="cart-total-price">₺0,00</span>
            </div>
            <button id="cart-clear" class="cart-clear-btn" data-translate="clear-cart">Sepeti Temizle</button>
        </div>
    </div>

    <!-- Sepet Overlay -->
    <div id="cart-overlay" class="cart-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/language.js"></script>
    <script src="js/restaurant-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
